<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-label="Token mit api-Berechtigung anlegen und verborgen eingeben"><title>Token mit api-Berechtigung anlegen und verborgen eingeben</title><rect width="880" height="340" rx="14" fill="#f1f5f2"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="28" y="24" width="430" height="292" rx="10" fill="#fff" stroke="#d8e1dc"/><text x="49" y="62" font-size="20" fill="#233c33" >GitLab · Personal access tokens</text><text x="49" y="100" font-size="20" fill="#233c33" >Name: TicketMap</text><text x="49" y="137" font-size="19" fill="#233c33" >Ablaufdatum: selbst festlegen</text><rect x="49" y="157" width="386" height="46" rx="10" fill="#e8f5ec" stroke="#246248"/><text x="67" y="188" font-size="23" fill="#233c33" >☑ api</text><text x="49" y="240" font-size="20" fill="#233c33" >Generate token</text><text x="49" y="281" font-size="17" fill="#62766b" >Token einmalig kopieren.</text><text x="478" y="181" font-size="32" fill="#233c33" >→</text><rect x="532" y="24" width="320" height="292" rx="10" fill="#1d2c27" stroke="#1d2c27"/><text x="551" y="65" font-size="19" fill="#d0f0da" >TicketMap-Startfenster</text><text x="551" y="113" font-size="23" fill="#fff" >GitLab-Token</text><text x="551" y="148" font-size="17" fill="#fff" >(Eingabe ist verborgen;</text><text x="551" y="176" font-size="17" fill="#fff" >leer = abbrechen):</text><text x="551" y="227" font-size="22" fill="#a9e5bd" >Einfügen → Enter</text><text x="551" y="277" font-size="16" fill="#c0cfc7" >Kein echter Token abgebildet.</text></g></svg>
